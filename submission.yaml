name: cuheng-ple
# LOCAL DEV config: artifacts are generated locally on a personal model, then
# this is switched to the Stage 2 target before the final commit
# (target: google-cloud/claude-opus-5-5). See README.md.
model_api: openai-compatible/gemini-3-8-flash
model_base_url: https://coarena.ai/api/v1
install: >-
  uv venv --python 3.12 /opt/harness/venv
  && uv pip install --python /opt/harness/venv/bin/python -r {src}/requirements.txt
serve: /opt/harness/venv/bin/python {src}/serve.py
