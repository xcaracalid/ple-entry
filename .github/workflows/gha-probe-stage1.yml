name: PLE GHA probe - stage 1 environment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Measure runner environment
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Report runner before cleanup
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Runner before cleanup"
            echo "- CPU count: $(nproc)"
            echo "- Memory:"
            free -h
            echo "- Disk:"
            df -h
            echo "- Docker version:"
            docker --version
            echo "- Docker info sanity:"
            docker info --format 'Server={{.ServerVersion}} Driver={{.Driver}} Containers={{.Containers}} Images={{.Images}}'
          } | tee "$GITHUB_STEP_SUMMARY"

      - name: Remove large preinstalled toolchains
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          docker image prune -af
          docker builder prune -af

      - name: Report disk after cleanup
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Disk after cleanup"
            df -h
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv and pinned Harbor
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade uv
          uv --version
          uv tool install harbor==0.20.0 --with websockets --python 3.12 --force
          export PATH="$HOME/.local/bin:$PATH"
          harbor --version

      - name: Final environment report
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Final runner state"
            echo "- CPU count: $(nproc)"
            echo "- Memory:"
            free -h
            echo "- Disk:"
            df -h
            echo "- Docker:"
            docker info --format 'Server={{.ServerVersion}} Driver={{.Driver}} Containers={{.Containers}} Images={{.Images}}'
          } | tee -a "$GITHUB_STEP_SUMMARY"
